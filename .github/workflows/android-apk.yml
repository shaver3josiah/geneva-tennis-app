name: Android APK

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "ABIs for the sideload .apk. arm64-v8a covers every real phone; add x86_64 only for an emulator."
        default: arm64-v8a
        required: false
      play_track:
        description: "Play track for the .aab. 'none' builds no bundle at all."
        default: internal
        required: false
        type: choice
        options: [internal, alpha, beta, production, none]
  push:
    tags: ['v*']

env:
  # A tag has no inputs, so it takes the default. `internal` is live within minutes,
  # needs no review, and reaches only the testers on the Play Console list -- the
  # right landing place for a release that nobody has looked at yet. Promoting to
  # production stays a human step in the console, because Play refuses a first
  # production release until Data Safety, the content rating and the target-audience
  # questionnaire are filled in, and no API fills those.
  PLAY_TRACK: ${{ inputs.play_track || 'internal' }}

permissions:
  # Needed only so the tag build can attach the .apk to a GitHub Release.
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    # The .apk alone used 1331s of this. The .aab is a second Gradle task on the same
    # build, cheap when the ABI sets match and a second full native compile when they
    # do not -- which is what a dispatch run building one ABI for the .apk asks for.
    timeout-minutes: 75   # fail rather than sit in a hung job
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm

      # React Native 0.86 documents JDK 17 for the Gradle build. (The CI workflow uses
      # JDK 21 instead, but only because firebase-tools demands it -- unrelated tool.)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # android/ does not exist yet (it is gitignored and regenerated by prebuild), so
      # there are no *.gradle files to hash at restore time. package-lock.json is the
      # honest key anyway: the JS dependency set is what decides the native modules.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      # .env is gitignored, and EXPO_PUBLIC_* is INLINED INTO THE BUNDLE at build time.
      # Without this the binary ships with no Firebase config at all: it installs, opens,
      # and dead-ends on "unconfigured" -- a build nobody can sign in to. None of these
      # values is a secret (a Firebase web config ships inside every copy of the app and
      # firebase/firestore.rules is what protects the data); they live in a secret only
      # because that is the one place a gitignored file can be kept in one piece.
      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_FILE" > .env

          # A missing secret would otherwise produce a perfectly green build of a dead
          # app. Fail here instead, where the message can name the cause.
          grep -qE '^EXPO_PUBLIC_FIREBASE_PROJECT_ID=.' .env || {
            echo "::error::The ENV_FILE secret is missing or has no EXPO_PUBLIC_FIREBASE_PROJECT_ID. See docs/START-HERE.md section A5."; exit 1; }
          grep -qE '^EXPO_PUBLIC_USE_EMULATOR=1' .env && {
            echo "::error::ENV_FILE points at the local emulator. A phone cannot reach it."; exit 1; } || true

          # The bundler reads .env, but exporting them too removes any doubt about which
          # working directory that lookup happens in.
          grep -E '^EXPO_PUBLIC_[A-Z0-9_]+=' .env >> "$GITHUB_ENV"

          echo "project $(grep -E '^EXPO_PUBLIC_FIREBASE_PROJECT_ID=' .env | cut -d= -f2)"

      # Regenerates android/ from app.json. This hard-fails unless android.package is
      # set in app.json. CI=1 keeps it non-interactive; EXPO_NO_GIT_STATUS=1 stops it
      # bailing out over the working tree it is about to dirty.
      - name: Prebuild android
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --no-clean

      # plugins/with-play-manifest.js makes the camera and the microphone OPTIONAL and
      # drops the template's unused "draw over other apps" permission. Both only matter
      # on Play, and both are invisible if the plugin silently stops matching a future
      # Expo template: the build stays green and the listing quietly loses every device
      # without a camera. Assert it here, on the generated file, where it is true or not.
      - name: Check the Play manifest corrections took
        run: |
          set -euo pipefail
          M=android/app/src/main/AndroidManifest.xml
          for f in android.hardware.camera android.hardware.camera.autofocus android.hardware.microphone; do
            grep -qE "uses-feature android:name=\"$f\" android:required=\"false\"" "$M" || {
              echo "::error::$f is not declared optional in $M -- plugins/with-play-manifest.js did not apply. Play would filter every device without it off the listing."; exit 1; }
          done
          grep -q 'SYSTEM_ALERT_WINDOW' "$M" && {
            echo "::error::SYSTEM_ALERT_WINDOW is back in the release manifest. Play asks a developer to justify it and this app has no floating window."; exit 1; } || true
          echo "manifest ok: camera, autofocus and microphone are optional; no overlay permission"

      # app.json pins android.versionCode to 1, so prebuild stamps every build as
      # versionCode 1. Android refuses to install an APK over an installed one with the
      # same versionCode, and Play rejects a duplicate outright -- so the second .apk is
      # uninstallable on any phone that already has the first. Use the run number, which
      # is monotonic and is exactly what the iOS job stamps into CFBundleVersion.
      #
      # This has to patch the GENERATED file: prebuild rewrites android/ on every run, so
      # a committed edit to android/app/build.gradle would be destroyed. Same reasoning as
      # the iOS job's PlistBuddy stamp. Both substitutions are verified below -- a silent
      # no-op here would recreate the exact bug this step fixes.
      - name: Stamp the version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          G=android/app/build.gradle

          sed -i -E "s|^([[:space:]]*)versionCode [0-9]+\$|\1versionCode $RUN_NUMBER|" "$G"
          grep -qE "^[[:space:]]*versionCode $RUN_NUMBER\$" "$G" || {
            echo "::error::no versionCode line matched in $G"; exit 1; }

          # On a tag, show testers a versionName that matches the release they are
          # installing (v1.2.0 -> 1.2.0). A workflow_dispatch run has no tag to take a
          # name from, so leave whatever expo.version in app.json produced.
          case "$GITHUB_REF" in
            refs/tags/v*)
              NAME="${GITHUB_REF_NAME#v}"
              sed -i -E "s|^([[:space:]]*)versionName \".*\"\$|\1versionName \"$NAME\"|" "$G"
              grep -qF "versionName \"$NAME\"" "$G" || {
                echo "::error::no versionName line matched in $G"; exit 1; }
              ;;
          esac

          grep -nE "^[[:space:]]*version(Code|Name) " "$G"

      # Gradle's assembleRelease runs Metro itself -- do NOT `expo export` first.
      #
      # ABIs are the whole build time. Measured on run 34992708992: assembleRelease was
      # 1257s of a 1331s job, 94% of it, and every other step is rounding error. That
      # time is spent compiling the native modules once per ABI, and the default set is
      # four: armeabi-v7a, arm64-v8a, x86, x86_64. Two of those are emulator-only and
      # accounted for 40MB of a 95MB APK -- no physical Android phone has ever been x86.
      #
      # arm64-v8a alone covers every phone built since about 2015, which is every phone
      # this app will be sideloaded onto. A tag build keeps the full set, because a
      # release is the artefact somebody might run anywhere; a dispatch can override the
      # input when someone genuinely needs an emulator build.
      #
      # NOTE: this is for the sideloaded .apk. A Play Store upload is an .aab from
      # bundleRelease and must carry every ABI; do not copy this flag there.

      # R8. The Play Console grades every upload on "DEX code optimization" and this app
      # scored Low, because RN 0.86's template defaults android.enableMinifyInReleaseBuilds
      # to false. It is a gradle property, not a file edit, which is the only reason it can
      # be set from here at all: prebuild rewrites android/ on every run, so a committed
      # edit to build.gradle or gradle.properties would be destroyed (same reasoning as the
      # versionCode stamp above).
      #
      # R8 touches only the Java/Kotlin shell. Every line of app logic is JS in a Hermes
      # bundle, which R8 cannot see, so nothing in src/ or app/ is at risk. What it can
      # break is a native module whose classes are found by reflection -- and every one
      # here ships its own consumer rules (expo, expo-modules-core, expo-notifications,
      # react-native-svg, reanimated, worklets, react-android), while the template's
      # app/proguard-rules.pro adds the reanimated keeps on top.
      #
      # SET ON BOTH GRADLE CALLS, ALWAYS. The .apk below is what gets sideloaded and
      # actually run on a phone; the .aab is what reaches Play. Minifying only one of them
      # would mean the build somebody tested is not the build that ships.
      - name: Assemble release
        working-directory: android
        env:
          ABIS: ${{ inputs.architectures || 'armeabi-v7a,arm64-v8a,x86,x86_64' }}
        run: |
          set -euo pipefail
          echo "building for: $ABIS"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures="$ABIS" \
            -Pandroid.enableMinifyInReleaseBuilds=true

      # R8 writes mapping.txt only when it actually ran, so this is the honest test that
      # the property above was not silently ignored -- a renamed property in a future Expo
      # template would otherwise give a green build that Play still grades Low.
      - name: Check R8 ran
        run: |
          set -euo pipefail
          M=android/app/build/outputs/mapping/release/mapping.txt
          [ -s "$M" ] || {
            echo "::error::$M is missing or empty -- R8 did not run. Check that android/app/build.gradle still reads android.enableMinifyInReleaseBuilds."; exit 1; }
          echo "R8 ran: $(wc -l < "$M") mapping lines"

      # Without this file an obfuscated stack trace is unreadable, and it exists only on
      # this runner. Play gets its own copy: AGP embeds the map in the bundle at
      # BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map, confirmed on the
      # .aab from run 35658091810. The sideloaded .apk carries none, though, which is what
      # this artifact is for -- a crash on a phone somebody installed by hand.
      - uses: actions/upload-artifact@v5
        with:
          name: r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Expo's prebuild template points the release buildType at signingConfigs.debug,
      # so the APK Gradle just produced is DEBUG-signed. prebuild rewrites android/ on
      # every run, so patching build.gradle would not survive; re-sign the artifact instead.
      - name: Sign APK
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILT=android/app/build/outputs/apk/release/app-release.apk
          OUT="$RUNNER_TEMP/geneva-tennis.apk"

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            # No keystore configured yet. The debug-signed APK still installs and runs,
            # and getting an .apk onto a phone is the whole point of this job, so ship
            # it rather than failing. Loud warning, not a hard stop.
            cp "$BUILT" "$OUT"
            echo "kind=debug-signed" >> "$GITHUB_OUTPUT"
            {
              echo "## :warning: This APK is DEBUG-SIGNED"
              echo ""
              echo "It installs and runs, but it is **not** a release-signed build:"
              echo "you cannot upload it to Play, and a future release-signed APK will"
              echo "**not** upgrade over it (Android will refuse: signature mismatch)."
              echo ""
              echo "Add the four \`ANDROID_*\` repository secrets to get a properly"
              echo "signed build. See \`docs/SHIPPING.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ubuntu-24.04 presets ANDROID_HOME=/usr/local/lib/android/sdk with several
          # build-tools versions installed; take the newest rather than pinning one.
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          # Shred the decoded keystore however this step ends. Without the trap,
          # `set -e` on a zipalign/apksigner failure leaves the signing identity
          # sitting on disk for every later step in the job.
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

          # zipalign BEFORE apksigner: aligning after signing would break the signature.
          "$BT/zipalign" -f -p 4 "$BUILT" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/upload.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"

          # Proves the re-sign actually replaced the debug certificate. If this prints
          # the Android Debug cert, the job is lying about being release-signed.
          "$BT/apksigner" verify --print-certs "$OUT"

          echo "kind=release-signed" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: geneva-tennis-apk-${{ steps.sign.outputs.kind }}
          path: ${{ runner.temp }}/geneva-tennis.apk
          if-no-files-found: error

      # ---------------------------------------------------------------------------
      # Google Play wants an .aab, not the .apk above. Same compiled code: Gradle has
      # already built the native libraries for this ABI set, so bundleRelease reuses
      # them and costs minutes rather than the half hour assembleRelease just spent.
      #
      # EVERY ABI, unlike the sideload .apk. Play splits the bundle per device and
      # serves each phone only its own slice, so the four-way build costs the download
      # nothing -- and leaving one out means those devices cannot install at all. x86
      # is not dead weight here either: Chromebooks run Android apps, and the manifest
      # now lets a camera-less one install.
      - name: Bundle release (.aab)
        if: env.PLAY_TRACK != 'none'
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PreactNativeArchitectures="armeabi-v7a,arm64-v8a,x86,x86_64" \
            -Pandroid.enableMinifyInReleaseBuilds=true

      # An .aab is a jar, so it is signed with jarsigner, not apksigner -- apksigner
      # only understands the APK format and refuses this file. Google re-signs the
      # bundle with the app signing key it holds; what we attach here is the UPLOAD
      # key, which is how Play knows the upload came from us.
      #
      # Unlike the .apk step there is no debug-signed fallback: Play rejects a
      # debug-signed bundle, so producing one would only waste the build.
      - name: Sign the AAB
        if: env.PLAY_TRACK != 'none'
        id: aab
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::A Play build needs the four ANDROID_* secrets. See docs/SHIPPING.md section 3."; exit 1
          fi

          BUILT=android/app/build/outputs/bundle/release/app-release.aab
          OUT="$RUNNER_TEMP/geneva-tennis.aab"

          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

          cp "$BUILT" "$OUT"
          # GRADLE HAS ALREADY SIGNED THIS, WITH THE ANDROID DEBUG KEY. Expo's template
          # points the release buildType at signingConfigs.debug, and jarsigner ADDS a
          # signature where apksigner REPLACES one -- so signing straight over the top
          # leaves TWO certificate chains, and Play rejects the upload with "Your
          # Android App Bundle has more than 1 certificate chain" half an hour after
          # the build. Drop every existing signature first. MANIFEST.MF stays, because
          # jarsigner rewrites its digests.
          zip -d "$OUT" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.SF" >/dev/null || true
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            "$OUT" "$ANDROID_KEY_ALIAS"

          # Play is otherwise the first thing that notices, and only at upload time.
          CHAINS=$(unzip -l "$OUT" | grep -ciE "META-INF/.*[.](RSA|DSA)$" || true)
          [ "$CHAINS" = "1" ] || { echo "::error::bundle carries $CHAINS certificate chains, not 1"; exit 1; }

          jarsigner -verify "$OUT"
          # Prints the signer. If this is the Android Debug certificate, Play will
          # reject the upload and this line is where to look first.
          keytool -printcert -jarfile "$OUT" | grep -E 'Owner|SHA256' | head -2

      - uses: actions/upload-artifact@v5
        if: env.PLAY_TRACK != 'none'
        with:
          name: geneva-tennis-aab
          path: ${{ runner.temp }}/geneva-tennis.aab
          if-no-files-found: error

      # Four plain HTTP calls, no marketplace action, because the credential this uses
      # can publish to the store under the owner's name and this repository is public.
      # scripts/check-play.mjs pins the call sequence offline.
      #
      # A missing secret is a warning, not a failure: the signed .aab is already an
      # artifact above, and it can be dragged into the Play Console by hand.
      - name: Upload to Google Play
        if: env.PLAY_TRACK != 'none'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            # An annotation, not only the summary: the summary alone left this step
            # green with nothing on the run page, so v1.0.5 read as uploaded and was not.
            echo "::warning title=Not uploaded to Google Play::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set. The signed .aab is the geneva-tennis-aab artifact of this run."
            {
              echo "## :warning: Not uploaded to Google Play"
              echo ""
              echo "The \`GOOGLE_PLAY_SERVICE_ACCOUNT_JSON\` secret is not set, so the"
              echo "signed bundle was built but not published. Download the"
              echo "**geneva-tennis-aab** artifact from this run and upload it in the"
              echo "Play Console, or set the secret. See \`docs/SHIPPING.md\` section 7."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          NAME="${GITHUB_REF_NAME}"
          node scripts/play-upload.mjs \
            --aab "$RUNNER_TEMP/geneva-tennis.aab" \
            --track "$PLAY_TRACK" \
            --name "$NAME"

          echo "## Uploaded to Google Play (\`$PLAY_TRACK\`)" >> "$GITHUB_STEP_SUMMARY"

      # gh is preinstalled on the runner, so no third-party action is needed here.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # Create the release only if the tag does not already have one, so a re-run
          # of this workflow replaces the APK instead of erroring on a duplicate.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$RUNNER_TEMP/geneva-tennis.apk" --clobber
