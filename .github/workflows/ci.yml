name: CI

# Fast feedback on every push and PR. Nothing here signs or ships anything.
on:
  push:
    # The default branch is 'main'; 'master' is listed too so a rename in either
    # direction does not silently stop CI from running.
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  # A new push to the same branch makes the in-flight run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # fail rather than sit in a hung job
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Expo SDK 57 requires Node >= 22.13.
          node-version: '22.13'
          cache: npm

      # firebase-tools refuses to boot the emulators on anything older than JDK 21
      # ("firebase-tools no longer supports Java version before 21"). This is a
      # DIFFERENT JDK from the 17 that the Android Gradle build wants in
      # android-apk.yml -- do not unify them.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # npm ci needs package-lock.json committed, and firebase-tools is a devDependency,
      # so this also provides the `firebase` binary used by npm run test:rules.
      - run: npm ci

      # src/period.ts decides which document a submission saves to. Its ISO-week edge
      # cases (a Sunday and the Monday after are different weeks; 1 Jan can belong to
      # last year's week 53) are exactly the kind of thing that silently merges two
      # weeks of game evaluations into one.
      - name: Period key self-check
        run: npm run test:period

      # projectDates decides which days a projected run of sessions lands on. Its
      # daylight-saving case is the kind of thing that silently moves a 4pm Tuesday to
      # 3pm for the rest of the season.
      - name: Schedule arithmetic self-check
        run: npm run test:schedule

      # Streak arithmetic and the reminder plan, including their own DST case.
      - name: Rewards self-check
        run: npm run test:rewards

      # The password reset must answer an unknown address exactly as it answers a
      # known one, or the screen becomes a way to ask whether a given family trains
      # here. That is one line away from being helpfully improved into a leak.
      - name: Auth message self-check
        run: npm run test:auth

      # src/worksheets.generated.ts is the copy of scripts/worksheets/*.html that ships
      # inside the binary. Edit the HTML, forget to regenerate, and the app keeps
      # serving the old worksheet with nothing to show that it has.
      - name: Built-in worksheets are current
        run: npm run check:worksheets

      # The match tracker page is BUILT from tracker/*.js and src/tennis/*.js. The same drift
      # risk again, one step earlier: edit a module, forget `npm run tracker`, and the phone
      # keeps running the old tracker.
      - name: Match tracker page is current
        run: npm run check:tracker

      # Scoring, stats, trends, the xlsx writer and the Google Sheets connector: the numbers
      # the coach reads. Includes the ITF end-change rule and the ITA college formats.
      - name: Tennis logic
        run: npm run test:tennis

      # assets/sfx/*.wav are generated by scripts/build-sounds.mjs and committed, so they
      # have the same drift risk as the worksheets above: change the generator, forget to
      # re-run it, and the app ships the old sound with nothing to show that it has.
      - name: Built-in sounds are current
        run: npm run check:sounds

      # workflowBridge is how a worksheet's answers become the one line the coach reads.
      # Its self-check fails if a known worksheet falls through to the generic "n fields
      # filled" summary, which is the failure that looks like working software.
      - name: Workflow bridge self-check
        run: npm run test:bridge

      # Five screens once passed behavior={Platform.OS === 'ios' ? 'padding' : undefined},
      # which is no keyboard avoidance at all on Android, and the roster's five invite
      # fields had none on either platform. Both are invisible until someone types on a
      # real phone, and the iOS-only pattern is what Expo's own guide still recommends,
      # so it comes back unless something fails the build.
      - name: Keyboard never covers a text field
        run: npm run check:keyboard

      # The Play upload script holds a credential that can publish to the store, and
      # every way it can fail is silent: a release pointing at a bundle nobody
      # uploaded, an edit that is never committed, a stranded edit blocking the next
      # run. The check is offline and takes a second.
      - name: Play upload self-check
        run: npm run test:play

      # review-account.mjs writes to the LIVE project with an admin credential, and its
      # one guardrail is that it refuses any athlete record naming an address that is not
      # a review address. Without that, the shortest path is to attach a store reviewer to
      # a real family and hand Google a real conversation about a real child. The guard is
      # a pure function so this runs offline in a second; disabling it fails three cases.
      - name: Review-account guardrail self-check
        run: npm run test:review

      # appstore-metadata.mjs would have rewritten the 1.0.4 record down to an untagged
      # build's 1.0.0. The guard is pure and offline.
      - name: App Store metadata self-check
        run: npm run test:appstore

      # The release panel sets repository secrets and pushes tags from localhost; who
      # may call it and what it will store are pure checks, pinned offline.
      - name: Release panel self-check
        run: npm run test:panel

      - name: Typecheck
        run: npx tsc --noEmit

      # Every foreground/background pair in app/ and src/, measured against WCAG 2.1 AA.
      # White on the gold fill is 2.8:1 and looks fine in a screenshot, which is exactly
      # why it is the build that fails and not a reviewer.
      - name: Contrast audit
        run: npm run contrast

      # emulators:exec starts Firestore, runs node --test against the rules, and
      # tears the emulator down again. The security rules are the whole authorization
      # model here, so this is the test suite that matters.
      # Query shape, not rules: that a busy thread still shows its newest message, and
      # that a thread-row preview reads one document instead of the whole thread.
      - name: Message window tests
        run: npm run test:messages

      - name: Firestore rules tests
        run: npm run test:rules
